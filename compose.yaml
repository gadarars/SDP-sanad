services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: sanad
      MYSQL_USER: sanad
      MYSQL_PASSWORD: sanad
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usanad", "-psanad"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
